[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-room-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3", "argon2-cffi>=23.1", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
[tool.setuptools.packages.find]
include = ["app*", "mandatory*", "bonus*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/export_api.py" = ["E501"]  # API reference prose and JSON examples
